<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styleLogin.css">
    <title>Login</title>
</head>

<body>
    
 <header>
        <img id="logo" src="imgs/Logo pizza.png" alt="logo-pizza">
        <h1 id="titulo">FORNO E CÓDIGO</h1>
    </header>



    <main>
        <section>
            <div class="fundo">
                <img src="imgs/steve-pizza1.png" alt="pizza">
            </div>

            <div class="fundo-2">
                <form action="index.html">
                    <h1>Faça Login:</h1>
                    <label for="fEmail" class="input-box">E-MAIL: </label>
                    <input type="email" id="fEmail" name="email" placeholder="Digite seu E-MAIL: " class="input-box"
                        style="color: black; " maxlength="50">

                    <label for="fSenha" class="input-box">Senha: </label>
                    <input type="password" name="senha" id="fSenha" class="input-box" style="color: black;">

                    <a href="https://www.youtube.com/" target="_blank">Esqueceu a senha? </a>

                    <div class="connect">
                        <input type="checkbox" name="connect" id="fConnect">
                        <label for="fConnect">Manter-me conectado</label>
                    </div>

                    <button type="submit"> Login </button>

                    <div id="linkCriarConta"><a href="criarConta.html">Não possui uma conta?</a></div>
                </form>
            </div>
        </section>
    </main>


</body>


</html>

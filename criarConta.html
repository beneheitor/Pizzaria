<!--<!DOCTYPE html>-->
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styleCriaConta.css">
    <title>CRIAR CONTA</title>
</head>

<body>

    <header>
        <img id="logo" src="imgs/Logo pizza.png" alt="logo-pizza">
        <h1 id="titulo">FORNO E CÓDIGO</h1>
    </header>

    <main>
        <section>
            <div id="fundo1"> <img src="imgs/Imagem fundo 1 - Criar Conta.png" alt="imagem Fundo 1 - CRIAR CONTA"></div>
            <div id="fundo2">
                <form action="telaLogin.html">
                    <h1>CRIAR CONTA:</h1>
                    <label for="contaNome" class="labels">Nome: </label>
                    <input type="name" name="criaconta" id="contaNome" class="inputs" placeholder="Digite seu nome: ">

                    <label for="contaSobrenome" class="labels">Sobrenome: </label>
                    <input type="text" name="criaconta" id="contaSobrenome" class="inputs"
                        placeholder="Digite seu sobrenome: ">

                    <label for="contaEmail" class="labels">E-mail: </label>
                    <input type="email" name="criaconta" id="contaEmail" class="inputs"
                        placeholder="Digite seu e-mail: ">

                    <label for="contaSenha" class="labels">Senha: </label>
                    <input type="password" name="criaconta" id="contaSenha" class="inputs">

                    <button type="submit">CADASTRA-SE</button>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
